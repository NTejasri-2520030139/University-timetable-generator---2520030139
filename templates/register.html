<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Register — UniSchedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-page">
  <div class="auth-card" style="max-width:500px">
    <div class="auth-logo">
      <div class="logo-icon">🗓️</div>
      UniSchedule
    </div>
    <h1 class="auth-title">Create account</h1>
    <p class="auth-subtitle">Join UniSchedule and start scheduling smarter</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ 'danger' if category == 'error' else category }}" style="margin-bottom:16px">
          {{ message }}
        </div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('register') }}">
      <!-- Role selector -->
      <div class="form-group">
        <label class="form-label">I am a</label>
        <div class="role-selector">
          <div class="role-option">
            <input type="radio" name="role" id="role-teacher" value="teacher">
            <label for="role-teacher">👨‍🏫 Teacher</label>
          </div>
          <div class="role-option">
            <input type="radio" name="role" id="role-student" value="student" checked>
            <label for="role-student">🎓 Student</label>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Full Name</label>
        <div class="input-group">
          <span class="input-icon">👤</span>
          <input class="form-control" type="text" name="fullname" placeholder="Dr. Ramesh Sharma" required autocomplete="name">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-group">
          <span class="input-icon">✉️</span>
          <input class="form-control" type="email" name="email" placeholder="you@university.edu" required autocomplete="email">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-control" type="password" name="password" placeholder="Min 6 characters" required autocomplete="new-password">
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <input class="form-control" type="password" name="confirm_password" placeholder="Repeat password" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-full" style="justify-content:center;margin-top:8px;padding:12px">
        Create Account →
      </button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:.84rem;color:rgba(255,255,255,.4)">
      Already have an account?
      <a href="{{ url_for('login') }}" style="color:#818cf8;font-weight:600">Sign in</a>
    </p>
    <p style="text-align:center;margin-top:8px;font-size:.78rem;color:rgba(255,255,255,.2)">
      <a href="{{ url_for('landing') }}" style="color:inherit">← Back to home</a>
    </p>
  </div>
</div>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
